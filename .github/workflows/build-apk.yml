name: Build Termia APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="termia-proyecto.zip"
          test -f "$ZIP" || { echo "No se encontró $ZIP en la raíz del repositorio."; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          echo "Contenido extraído:"
          find source -maxdepth 3 -type f \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'package.json' \) -print | head -80

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No se encontró gradlew dentro de termia-proyecto.zip."
            echo "El ZIP podría no contener un proyecto Android/Gradle listo para compilar."
            find source -maxdepth 4 -type f | head -150
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termia-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
