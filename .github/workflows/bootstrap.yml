name: Bootstrap Termia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar proyecto Termia
        run: |
          set -e
          base64 -d termia-source.b64 > termia-source.zip
          rm -rf .github/workflows/build-apk.yml www LEEME.md
          unzip -o termia-source.zip
          rm -f termia-source.zip termia-source.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restaurar proyecto Termia y activar compilación [skip ci]"
          git push
